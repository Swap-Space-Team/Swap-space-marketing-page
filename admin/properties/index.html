<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Properties | SwapSpace Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="styles.css">
  <!-- supabase-js UMD must load before admin.js (it reads window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-container">
    <!-- Header (mirrors applications.html) -->
    <div class="admin-header">
      <div>
        <a href="/admin/applications"><img src="/assets/Swapspace wordmark.svg" height="28" alt="SwapSpace"></a>
      </div>
      <div class="admin-header-right">
        <div class="profile-menu-wrap">
          <button class="profile-icon-btn" onclick="toggleProfileMenu(event)" aria-label="Account menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="profile-dropdown" id="profileDropdown">
            <span class="profile-dropdown-email" id="userEmail"></span>
            <div class="profile-dropdown-divider"></div>
            <button class="profile-dropdown-item" onclick="showChangePassword(); closeProfileMenu()">Change password</button>
            <button class="profile-dropdown-item profile-dropdown-item--danger" onclick="signOut()">Sign out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="pp-intro">
      <h1>Properties</h1>
      <p>
        Every listing on the SwapSpace platform, drafts included. Open a listing to see its photos,
        unpublish it, or remove individual photos. Each action is recorded under your email.
      </p>
    </div>

    <!-- Toolbar -->
    <div class="pp-toolbar">
      <form class="search-box" id="searchForm" role="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="searchInput" placeholder="Title or host email" aria-label="Search properties">
      </form>
      <div class="pp-filter">
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="true">Published</option>
          <option value="false">Not published</option>
        </select>
      </div>
      <span class="pp-count" id="countLabel">Loading…</span>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Listing</th>
            <th>Host</th>
            <th>Location</th>
            <th>Status</th>
            <th>Updated</th>
          </tr>
        </thead>
        <tbody id="rowsBody">
          <tr><td colspan="5" class="loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pp-pager" id="pager" style="display:none;">
      <button class="btn btn-secondary btn-sm" id="prevBtn" onclick="changePage(-1)">← Previous</button>
      <span class="pp-page-label" id="pageLabel">Page 1</span>
      <button class="btn btn-secondary btn-sm" id="nextBtn" onclick="changePage(1)">Next →</button>
    </div>
  </div>

  <!-- Property drawer -->
  <div class="pp-drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <aside class="pp-drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="pp-drawer-head">
      <div>
        <h2 id="drawerTitle">Property</h2>
        <div class="pp-drawer-meta" id="drawerMeta"></div>
      </div>
      <button class="pp-drawer-close" onclick="closeDrawer()" aria-label="Close">&times;</button>
    </div>
    <div class="pp-drawer-body" id="drawerBody"></div>
  </aside>

  <script src="/admin/admin.js"></script>
  <script src="app.js"></script>
</body>
</html>
